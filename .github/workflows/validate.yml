name: Validate release center

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python scripts and tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          python -m unittest discover -s tests -v

      - name: Validate documentation links
        run: python scripts/check_markdown_links.py

      - name: Reject committed generated or secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(__pycache__|\.work|\.local-secrets|dist)(/|$)|\.(pyc|key|pem)$'; then
            echo "Generated output or a secret-like file is tracked." >&2
            exit 1
          fi
