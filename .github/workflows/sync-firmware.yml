name: Publish official firmware releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Validate configuration without building or publishing"
        required: true
        default: false
        type: boolean
      tag:
        description: "Optional exact official tag (vMAJOR.MINOR.PATCH)"
        required: false
        type: string

concurrency:
  group: firmware-tag-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build one missing official tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firmware-build
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      release_state: ${{ steps.select.outputs.release_state }}
    env:
      UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
      MINIMUM_FIRMWARE_TAG: ${{ vars.MINIMUM_FIRMWARE_TAG || 'v1.7.0' }}
      REQUESTED_TAG: ${{ inputs.tag || '' }}

    steps:
      - name: Check out release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure authenticated source transport
        shell: bash
        env:
          UPSTREAM_READ_KEY: ${{ secrets.UPSTREAM_READ_KEY }}
          UPSTREAM_SSH_KNOWN_HOSTS: ${{ vars.UPSTREAM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_REPOSITORY"
          test -n "$UPSTREAM_READ_KEY"
          test -n "$UPSTREAM_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$UPSTREAM_READ_KEY" > "$HOME/.ssh/upstream_read_key"
          printf '%s\n' "$UPSTREAM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/upstream_read_key" "$HOME/.ssh/known_hosts"
          {
            echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/upstream_read_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Select one unpublished official tag
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/select_release.py

      - name: Fetch the exact tagged source
        if: steps.select.outputs.tag != '' && inputs.check_only != true
        id: source
        shell: bash
        env:
          FIRMWARE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .work/source
          git -C .work/source init --quiet
          git -C .work/source remote add origin "git@github.com:${UPSTREAM_REPOSITORY}.git"
          git -C .work/source fetch --quiet --depth=1 origin "refs/tags/${FIRMWARE_TAG}:refs/tags/${FIRMWARE_TAG}"
          git -C .work/source checkout --quiet --detach "refs/tags/${FIRMWARE_TAG}"
          test -z "$(git -C .work/source status --porcelain)"
          source_commit="$(git -C .work/source rev-parse HEAD)"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          rm -f "$HOME/.ssh/upstream_read_key"

      - name: Install pinned PlatformIO Core
        if: steps.select.outputs.tag != '' && inputs.check_only != true
        run: python -m pip install --disable-pip-version-check --no-input "platformio==6.1.19"

      - name: Build all supported firmware variants
        if: steps.select.outputs.tag != '' && inputs.check_only != true
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t environments < <(python scripts/release_matrix.py --tag "$FIRMWARE_VERSION" --environments)
          test "${#environments[@]}" -gt 0
          for environment in "${environments[@]}"; do
            build_log="$RUNNER_TEMP/platformio-${environment}.log"
            if ! pio run \
              --project-dir .work/source \
              --environment "$environment" \
              >"$build_log" 2>&1; then
              echo "::error::Firmware build failed for ${environment}. Detailed compiler output is intentionally withheld from this public log."
              exit 1
            fi
            rm -f "$build_log"
            echo "Built ${environment}."
          done

      - name: Encrypt private build diagnostics on failure
        if: failure() && steps.select.outputs.tag != '' && inputs.check_only != true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/platformio-*.log)
          test "${#logs[@]}" -gt 0
          archive="$RUNNER_TEMP/platformio-build-diagnostics.tar.gz"
          encrypted="$RUNNER_TEMP/platformio-build-diagnostics.cms"
          names=()
          for log in "${logs[@]}"; do
            names+=("$(basename "$log")")
          done
          tar -C "$RUNNER_TEMP" -czf "$archive" "${names[@]}"
          openssl cms -encrypt \
            -binary \
            -aes-256-cbc \
            -in "$archive" \
            -outform DER \
            -out "$encrypted" \
            keys/build-diagnostics-encryption-cert.pem
          rm -f "$archive" "${logs[@]}"

      - name: Upload encrypted build diagnostics
        if: failure() && steps.select.outputs.tag != '' && inputs.check_only != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/platformio-build-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Create the unsigned release allowlist
        if: steps.select.outputs.tag != '' && inputs.check_only != true
        shell: bash
        env:
          FIRMWARE_TAG: ${{ steps.select.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          install -d "$DIST_DIR"
          mapfile -t environments < <(python scripts/release_matrix.py --tag "$FIRMWARE_TAG" --environments)
          for environment in "${environments[@]}"; do
            source_file=".work/source/.pio/build/${environment}/firmware.uf2"
            identity_file=".work/source/.pio/build/${environment}/firmware.bin"
            test -f "$source_file"
            test -f "$identity_file"
            case "$environment" in
              dual_*)
                grep -aFq "HEIMAN-NSP-${FIRMWARE_TAG}-32" "$identity_file"
                grep -aFq "BANANA-THERMAL:dual:${environment}" "$identity_file"
                ;;
              standard_*)
                grep -aFq "HEIMAN-NSP-STANDARD-${FIRMWARE_TAG}-32" "$identity_file"
                grep -aFq "BANANA-THERMAL:standard:${environment}" "$identity_file"
                ;;
              *)
                grep -aFq "HEIMAN-NSP-${FIRMWARE_TAG}-32" "$identity_file"
                ;;
            esac
            install -m 644 "$source_file" "$DIST_DIR/banana-thermal-${FIRMWARE_TAG}-${environment}.uf2"
          done
          install -m 644 keys/firmware-release-allowed-signers "$DIST_DIR/firmware-release-allowed-signers"
          python scripts/make_manifest.py
          (
            cd "$DIST_DIR"
            sha256sum ./*.uf2 ./manifest.json ./firmware-release-allowed-signers > SHA256SUMS
          )
          python scripts/verify_release_package.py \
            --dist "$DIST_DIR" \
            --tag "$FIRMWARE_TAG" \
            --unsigned

      - name: Transfer the unsigned release package
        if: steps.select.outputs.tag != '' && inputs.check_only != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-release-${{ steps.select.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary source and credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.ssh/upstream_read_key"
          if [ -d .work/source ]; then
            find .work/source -type f -exec chmod u+w {} +
            rm -rf .work/source
          fi

  publish:
    name: Verify, sign and publish
    if: needs.build.outputs.tag != '' && inputs.check_only != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firmware-release
    permissions:
      contents: write
    env:
      FIRMWARE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_STATE: ${{ needs.build.outputs.release_state }}

    steps:
      - name: Check out release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Receive the unsigned release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Verify the unsigned release allowlist
        shell: bash
        run: |
          set -euo pipefail
          cmp keys/firmware-release-allowed-signers dist/firmware-release-allowed-signers
          python scripts/verify_release_package.py \
            --dist dist \
            --tag "$FIRMWARE_TAG" \
            --unsigned

      - name: Sign and verify release checksums
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          signing_key="$RUNNER_TEMP/firmware-release-signing"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          ssh-keygen -Y sign -f "$signing_key" -n file dist/SHA256SUMS
          ssh-keygen -Y verify \
            -f keys/firmware-release-allowed-signers \
            -I banana-thermal-firmware \
            -n file \
            -s dist/SHA256SUMS.sig < dist/SHA256SUMS
          python scripts/verify_release_package.py \
            --dist dist \
            --tag "$FIRMWARE_TAG"

      - name: Create or resume draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="docs/releases/${FIRMWARE_TAG}.md"
          if [ -f "$release_notes" ]; then
            cp "$release_notes" "$RUNNER_TEMP/release-notes.md"
          else
            {
              echo "香蕉热成像设备固件 ${FIRMWARE_TAG}"
              echo
              echo "请使用最新版 NextBananaThermalStudio，并根据 dual / standard 板型和 Flash 规格选择 UF2。"
              echo "普通热成像首次迁移会格式化 LittleFS；请先备份照片、配置和校准。跨 2 MB / 8 MB 分区可能需要重新激活。"
              echo "本版本由官方同名 Tag 自动构建并完成完整性签名；Release 不包含设备源码。"
            } > "$RUNNER_TEMP/release-notes.md"
          fi

          if [ "$RELEASE_STATE" = "missing" ]; then
            gh release create "$FIRMWARE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Banana Thermal Firmware ${FIRMWARE_TAG}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload "$FIRMWARE_TAG" dist/* --clobber

      - name: Verify draft assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$FIRMWARE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual"
          gh release edit "$FIRMWARE_TAG" --draft=false
